name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    actionlint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - name: Lint workflows
              run: |
                  bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
                  ./actionlint -color
